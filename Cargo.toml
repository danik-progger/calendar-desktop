[package]
name = "calendar-gpui"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
base64 = "0.22"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
futures-channel = "0.3"
futures-util = "0.3"
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
lyon = "1"
gpui-component = { version = "=0.5.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSAppearance", "NSColor", "NSView", "NSWindow", "NSWorkspace", "NSAccessibility"] }
raw-window-handle = "0.6"

[dev-dependencies]
gpui = { version = "=0.2.2", features = ["test-support"] }
